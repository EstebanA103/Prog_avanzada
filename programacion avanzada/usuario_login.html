
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - EnferPacient</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="encabezado py-3 text-center">
        <div class="container d-flex flex-column align-items-center position-relative">

            <div class="position-absolute end-0 top-0 mt-2 me-2">
                <a href="registro.html" class="btn btn-warning btn-sm fw-bold">Registro</a>
            </div>

            <a href="index.html" class="mb-2">
                <img src="img/logo.png" alt="Chill d Balls Logo" class="mi-logo">
            </a>

            <div class="text-center">
                <h1 class="h2 m-0 fw-bold">EnferPacient</h1>
                <small>Tu bienestar nos une. Inicia sesión para continuar con tu cuidado.</small>
            </div>

        </div>
    </header>

    <div class="container my-5 d-flex justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="caja-producto p-4 text-start">
                <h3 class="text-center mb-4 fw-bold">INICIAR SESIÓN</h3>

                <form action="usuario_login.php" method="POST">

                    <div class="mb-3">
                        <label for="login_correo" class="form-label fw-bold">Correo Electrónico:</label>
                        <input type="email" class="form-control"
                               id="login_correo" name="correo"
                               placeholder="usuario@correo.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="login_contrasena" class="form-label fw-bold">Contraseña:</label>
                        <input type="password" class="form-control"
                               id="login_contrasena" name="contrasena"
                               placeholder="••••••••" required minlength="6">
                    </div>

                    <div class="mb-3 form-check">
                        <label for="recordarme" class="form-check-label">Recordarme</label>
                        <input type="checkbox" class="form-check-input" id="recordarme">
                    </div>

                    <button type="submit" class="btn-comprar w-100 py-2 mb-3">Entrar</button>

                    <div class="text-center">
                        <small>¿No tienes cuenta? <a href="registro.html" class="fw-bold text-decoration-none">Regístrate aquí</a></small>
                        <br>
                        <small><a href="index.html" class="text-muted text-decoration-none">Vuelve al inicio</a></small>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <footer class="pie-pagina text-center py-3">
        <p class="m-0">© 2026 EnferPacient - La salud es la vida</p>
    </footer>

</body>
</html>
