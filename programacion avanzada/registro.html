<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - EnferPacient</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="encabezado py-3 px-4">
        <div class="container d-flex flex-row align-items-center justify-content-between flex-wrap">
        
            <div class="d-flex align-items-center">
                <a href="index.html" class="mb-0 me-3">
                    <img src="img/logo.png" alt="EnferPacient Logo" class="mi-logo">
                </a>
                <div class="text-start">
                    <h1 class="h2 m-0 fw-bold">EnferPacient</h1>
                    <small>La salud es la vida</small>
                </div>
            </div>

            <div class="d-flex gap-2 mt-2 mt-md-0">
                <a href="usuario_login.html" class="btn btn-sm fw-bold" style="background:#0B3D7A; color:white; border-radius:20px; padding:6px 14px;">Iniciar Sesión</a>
                <a href="enfermero_registro.html" class="btn btn-sm fw-bold" style="background:#1EADF0; color:white; border-radius:20px; padding:6px 14px;">Enfermero Registro</a>
                <a href="reserva.html" class="btn btn-sm fw-bold" style="background:#C2FF36; color:#0B3D7A; border-radius:20px; padding:6px 14px;">Reserva registro</a>
            </div>

        </div>
    </header>

    <div class="container my-5 d-flex justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="caja-producto p-4 text-start">
                <div class="text-center mb-4">
                    <h3 class="fw-bold m-0" style="color:#0B3D7A;">CREAR CUENTA</h3>
                    <small style="color:#64748b;">Tu bienestar nos une. Crea tu cuenta para continuar con tu cuidado.</small>
                </div>
                
                <form action="#" method="POST">
                    
                    <div class="mb-3">
                        <label for="reg-nombre" class="form-label fw-bold">Nombre Completo:</label>
                        <input type="text" class="form-control" id="reg-nombre" placeholder="Tu Nombre y Apellido" required minlength="3" style="border-radius:10px;">
                    </div>

                    <div class="mb-3">
                        <label for="reg-email" class="form-label fw-bold">Correo Electrónico:</label>
                        <input type="email" class="form-control" id="reg-email" placeholder="ejemplo@correo.com" required style="border-radius:10px;">
                    </div>

                    <div class="mb-3">
                        <label for="reg-tel" class="form-label fw-bold">Teléfono (10 dígitos):</label>
                        <input type="number" class="form-control" id="reg-tel" placeholder="3001234567" pattern="[0-9]{10}" style="border-radius:10px;">
                    </div>

                    <div class="mb-3">
                        <label for="reg-password" class="form-label fw-bold">Contraseña:</label>
                        <input type="password" class="form-control" id="reg-password" placeholder="Mínimo 6 caracteres" required minlength="6" style="border-radius:10px;">
                    </div>

                    <div class="mb-3">
                        <label for="reg-password-confirm" class="form-label fw-bold">Confirmar Contraseña:</label>
                        <input type="password" class="form-control" id="reg-password-confirm" placeholder="Repite tu contraseña" required minlength="6" style="border-radius:10px;">
                    </div>

                    <button type="submit" class="btn-comprar w-100 py-2 mb-3">Registrarme</button>

                    <div class="text-center">
                        <small>¿Ya tienes cuenta? <a href="usuario_login.html" class="fw-bold text-decoration-none" style="color:#0B3D7A;">Inicia sesión</a></small> <br>
                        <small><a href="index.html" class="text-muted text-decoration-none">Volver al inicio</a></small>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="pie-pagina text-center py-3">
        <p class="m-0">© 2026 EnferPacient - La salud es la vida</p>
    </footer>

</body>
</html>
